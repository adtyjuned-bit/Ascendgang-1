<!-- =========================================
     NAINSAN — UNKNOWN.HTML

     SECTION 06 — UNKNOWN

     Konsep:
     Hidden room / corrupted signal /
     something that should not be here.
========================================= -->

<main class="unknown-page">


    <!-- =====================================
         BACKGROUND
    ====================================== -->

    <div class="unknown-noise"></div>

    <div class="unknown-glow"></div>


    <!-- =====================================
         HEADER
    ====================================== -->

    <header
        class="unknown-header"
        data-reveal
    >

        <div class="unknown-index">

            <span>
                WORLD 01
            </span>

            <span>
                / ??
            </span>

        </div>


        <div class="unknown-status">

            <i></i>

            UNIDENTIFIED

        </div>

    </header>


    <!-- =====================================
         MAIN CONTENT
    ====================================== -->

    <section
        class="unknown-content"
        data-reveal
    >


        <!-- SIGNAL -->
        <div class="unknown-signal">

            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>

        </div>


        <!-- LABEL -->

        <span class="unknown-label">
            ACCESS POINT // 06
        </span>


        <!-- TITLE -->

        <h1>

            UNKNOWN

            <span>
                ?
            </span>

        </h1>


        <!-- MESSAGE -->

        <p class="unknown-message">

            This section does not belong
            to the current world.

        </p>


        <!-- DIVIDER -->

        <div class="unknown-divider">

            <span></span>

        </div>


        <!-- SYSTEM MESSAGE -->

        <div class="unknown-system">

            <span>
                SYSTEM MESSAGE
            </span>

            <p id="unknownMessage">

                SIGNAL DETECTED.

            </p>

        </div>


        <!-- ACTION -->

        <button
            type="button"
            class="unknown-button"
            id="unknownButton"
        >

            <span>
                INVESTIGATE
            </span>

            <b>
                →
            </b>

        </button>


    </section>


    <!-- =====================================
         FOOTER
    ====================================== -->

    <footer
        class="unknown-footer"
        data-reveal
    >

        <span>
            RECORD STATUS
        </span>

        <strong>
            NOT FOUND
        </strong>

    </footer>


    <!-- =====================================
         SECRET MESSAGE
    ====================================== -->

    <div
        class="unknown-reveal"
        id="unknownReveal"
    >

        <div class="unknown-reveal-inner">

            <span>
                SIGNAL 000
            </span>

            <h2>
                YOU FOUND IT.
            </h2>

            <p>
                But there is nothing here.
            </p>

            <small>
                ...yet.
            </small>

            <button
                type="button"
                id="unknownClose"
            >
                CLOSE
            </button>

        </div>

    </div>


</main>
