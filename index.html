<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ascend Hero Parallax</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@800;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #05020a;
      color: #ffffff;
      font-family: 'Rajdhani', sans-serif;
      overflow-x: hidden;
    }

    /* SECTION HERO SLIDE ATAS */
    .hero-section {
      position: relative;
      width: 100%;
      height: 100vh; /* Memenuhi 1 layar penuh */
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      background: radial-gradient(circle at 50% 50%, #1a082e 0%, #05020a 80%);
    }

    /* EFEK PARALLAX LAYER */
    .parallax-layer {
      position: absolute;
      will-change: transform; /* Optimalisasi performa animasi */
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    /* LAYER 1: LOGO BESAR (PALING BELAKANG) */
    .layer-bg-logo {
      z-index: 1;
      width: 320px;
      height: 320px;
      opacity: 0.15; /* Dibuat agak transparan sebagai background */
      filter: blur(2px) drop-shadow(0 0 30px #a800ff);
    }

    /* LAYER 2: LOGO SEDANG (DI TENGAH) */
    .layer-mid-logo {
      z-index: 2;
      width: 140px;
      height: 140px;
      margin-bottom: 160px; /* Jarak agar berada di belakang/atas teks */
      filter: drop-shadow(0 0 20px #00e5ff);
    }

    /* LAYER 3: TEKS (PALING DEPAN) */
    .layer-text {
      z-index: 3;
      margin-top: 80px;
    }

    .title-ascend {
      font-family: 'Orbitron', sans-serif;
      font-size: 3.5rem;
      font-weight: 900;
      letter-spacing: 6px;
      background: linear-gradient(180deg, #ffffff 30%, #a855f7 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px rgba(168, 0, 255, 0.6);
      line-height: 1;
    }

    .slogan-turevent {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.2rem;
      font-weight: 800;
      color: #00e5ff;
      letter-spacing: 8px;
      margin-top: 10px;
      text-shadow: 0 0 12px #00e5ff;
    }

    /* DUMMY CONTENT (UNTUK MEMUNGKINKAN SCROLL KE BAWAH) */
    .content-section {
      position: relative;
      z-index: 10;
      background-color: #090514;
      padding: 80px 20px;
      min-height: 100vh;
      border-top: 2px solid #a800ff;
      box-shadow: 0 -20px 50px rgba(168, 0, 255, 0.3);
      text-align: center;
    }

    .content-section h2 {
      font-family: 'Orbitron', sans-serif;
      color: #00e5ff;
      font-size: 2rem;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>

  <!-- HERO SLIDE PARALLAX -->
  <section class="hero-section">
    
    <!-- IMAGE 1: Logo Besar (Paling Belakang) -->
    <div class="parallax-layer layer-bg-logo" id="layer-bg">
      <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M50 5 L85 85 L50 68 L15 85 Z" fill="#a800ff" stroke="#ffffff" stroke-width="2"/>
      </svg>
    </div>

    <!-- IMAGE 2: Logo Sedang (Di Tengah) -->
    <div class="parallax-layer layer-mid-logo" id="layer-mid">
      <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M50 5 L85 85 L50 68 L15 85 Z" fill="url(#grad)" stroke="#00e5ff" stroke-width="2"/>
        <defs>
          <linearGradient id="grad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="100%" stop-color="#a800ff"/>
          </linearGradient>
        </defs>
      </svg>
    </div>

    <!-- TEXT: ASCEND & TUREVENT (Paling Depan) -->
    <div class="parallax-layer layer-text" id="layer-text">
      <h1 class="title-ascend">ASCEND</h1>
      <div class="slogan-turevent">TUREVENT</div>
    </div>

  </section>

  <!-- KONTEN BAWAH -->
  <section class="content-section">
    <h2>NEXT CONTENT SECTION</h2>
    <p style="color: #a0aec0;">Gulir kembali ke atas untuk melihat efek parallax-nya.</p>
  </section>

  <!-- JAVASCRIPT UNTUK CONTROL PARALLAX SCROLL -->
  <script>
    const layerBg = document.getElementById('layer-bg');
    const layerMid = document.getElementById('layer-mid');
    const layerText = document.getElementById('layer-text');

    window.addEventListener('scroll', () => {
      let value = window.scrollY;

      // Pengaturan Kecepatan (Multipliers):
      // 0.15 = Sangat Pelan (Logo Besar)
      // 0.40 = Sedang (Logo Sedang)
      // 0.85 = Sangat Cepat (Teks ASCEND & TUREVENT)
      layerBg.style.transform = `translateY(${value * 0.15}px)`;
      layerMid.style.transform = `translateY(${value * 0.40}px)`;
      layerText.style.transform = `translateY(${value * 0.85}px)`;
    });
  </script>
</body>
</html>
