<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyberpunk Animated Navbar</title>
  
  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #05020a;
      color: white;
      font-family: 'Rajdhani', sans-serif;
      min-height: 200vh; /* Agar bisa dites scroll */
    }

    /* ================= NAVBAR CONTAINER ================= */
    .cyber-nav-wrapper {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 1000px;
      z-index: 999;
    }

    .cyber-nav {
      position: relative;
      background: rgba(13, 8, 28, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(0, 229, 255, 0.3);
      padding: 12px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      
      /* Pemotongan Sudut Khas Game HUD (Cyber Cut Corners) */
      clip-path: polygon(
        0 0, 
        calc(100% - 18px) 0, 
        100% 18px, 
        100% 100%, 
        18px 100%, 
        0 calc(100% - 18px)
      );
      
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5),
                  inset 0 0 15px rgba(0, 229, 255, 0.15);
      transition: all 0.3s ease;
    }

    /* Efek Glow Line di Atas Navbar */
    .cyber-nav::before {
      content: '';
      position: absolute;
      top: 0;
      left: 10%;
      width: 80%;
      height: 2px;
      background: linear-gradient(90deg, transparent, #00e5ff, #a800ff, transparent);
    }

    /* ================= LOGO AREA ================= */
    .nav-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }

    .nav-logo-icon {
      width: 32px;
      height: 32px;
      filter: drop-shadow(0 0 8px #00e5ff);
      animation: pulseGlow 2s infinite alternate;
    }

    @keyframes pulseGlow {
      0% { filter: drop-shadow(0 0 4px #00e5ff); }
      100% { filter: drop-shadow(0 0 12px #a800ff); }
    }

    .nav-title {
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: 1.3rem;
      letter-spacing: 2px;
      background: linear-gradient(90deg, #ffffff, #00e5ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* ================= MENU LINKS ================= */
    .nav-menu {
      display: flex;
      align-items: center;
      gap: 30px;
      list-style: none;
    }

    .nav-item {
      position: relative;
    }

    .nav-link {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
      color: #a0aec0;
      text-decoration: none;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 6px 0;
      transition: color 0.3s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .nav-link i {
      font-size: 0.8rem;
      opacity: 0.6;
      transition: opacity 0.3s ease;
    }

    /* Hover State Links */
    .nav-link:hover {
      color: #00e5ff;
      text-shadow: 0 0 8px rgba(0, 229, 255, 0.8);
    }

    .nav-link:hover i {
      opacity: 1;
      color: #00e5ff;
    }

    /* Animasi Garis Bawah saat Hover */
    .nav-link::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0%;
      height: 2px;
      background: var(--cyan, #00e5ff);
      box-shadow: 0 0 8px #00e5ff;
      transition: width 0.3s ease;
    }

    .nav-link:hover::after {
      width: 100%;
    }

    /* ================= ACTION BUTTON (CYBER CTA) ================= */
    .nav-cta {
      position: relative;
      padding: 8px 20px;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.8rem;
      font-weight: 900;
      letter-spacing: 1.5px;
      color: #05020a;
      background: #00e5ff;
      border: none;
      cursor: pointer;
      clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
      box-shadow: 0 0 15px rgba(0, 229, 255, 0.5);
      transition: all 0.3s ease;
      text-decoration: none;
      display: inline-block;
    }

    .nav-cta:hover {
      background: #a800ff;
      color: #ffffff;
      box-shadow: 0 0 25px rgba(168, 0, 255, 0.8);
      transform: translateY(-2px);
    }

    /* ================= MOBILE HAMBURGER TOGGLE ================= */
    .mobile-toggle {
      display: none;
      background: transparent;
      border: none;
      color: #00e5ff;
      font-size: 1.5rem;
      cursor: pointer;
      filter: drop-shadow(0 0 5px #00e5ff);
    }

    /* ================= RESPONSIVE (MOBILE VIEW) ================= */
    @media (max-width: 768px) {
      .cyber-nav-wrapper {
        top: 10px;
        width: 95%;
      }

      .mobile-toggle {
        display: block;
      }

      .nav-menu {
        position: absolute;
        top: 100%;
        left: 0;
        width: 100%;
        margin-top: 10px;
        background: rgba(13, 8, 28, 0.95);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(0, 229, 255, 0.3);
        flex-direction: column;
        padding: 20px;
        gap: 20px;
        clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
        opacity: 0;
        pointer-events: none;
        transform: translateY(-10px);
        transition: all 0.3s ease;
      }

      .nav-menu.active {
        opacity: 1;
        pointer-events: all;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>

  <!-- NAVBAR HUD UTAMA -->
  <div class="cyber-nav-wrapper">
    <nav class="cyber-nav">
      
      <!-- LOGO / BRAND -->
      <a href="#" class="nav-brand">
        <svg class="nav-logo-icon" viewBox="0 0 100 100" fill="none">
          <path d="M50 5 L85 85 L50 68 L15 85 Z" fill="url(#nav-grad)" stroke="#00e5ff" stroke-width="3"/>
          <defs>
            <linearGradient id="nav-grad" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#ffffff"/>
              <stop offset="100%" stop-color="#a800ff"/>
            </linearGradient>
          </defs>
        </svg>
        <span class="nav-title">ASCEND</span>
      </a>

      <!-- LINK NAVIGASI -->
      <ul class="nav-menu" id="navMenu">
        <li class="nav-item">
          <a href="#" class="nav-link"><i class="fa-solid fa-house"></i> Home</a>
        </li>
        <li class="nav-item">
          <a href="#" class="nav-link"><i class="fa-solid fa-trophy"></i> Bracket</a>
        </li>
        <li class="nav-item">
          <a href="#" class="nav-link"><i class="fa-solid fa-newspaper"></i> Rules</a>
        </li>
        <li class="nav-item">
          <a href="#" class="nav-link"><i class="fa-solid fa-circle-question"></i> FAQ</a>
        </li>
      </ul>

      <!-- BUTTON ACTION & MOBILE TOGGLE -->
      <div style="display: flex; align-items: center; gap: 15px;">
        <a href="#" class="nav-cta">DISCORD</a>
        <button class="mobile-toggle" id="mobileToggle">
          <i class="fa-solid fa-bars-staggered"></i>
        </button>
      </div>

    </nav>
  </div>

  <script>
    // Toggle Menu Mobile
    const mobileToggle = document.getElementById('mobileToggle');
    const navMenu = document.getElementById('navMenu');

    mobileToggle.addEventListener('click', () => {
      navMenu.classList.toggle('active');
    });
  </script>

</body>
</html>
